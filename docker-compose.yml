version: "3.9"

services:
  backend:
    image: vishal071992/imextractor-backend:v18
    build: .
    container_name: backend
    command: uvicorn backend:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    restart: unless-stopped

  ui:
    image: vishal071992/imextractor-ui:v18
    build: .
    container_name: ui
    command: streamlit run streamlit_app.py --server.port 9001 --server.address 0.0.0.0
    ports:
      - "9001:9001"
    environment:
      - API_BASE=http://backend:9000
    depends_on:
      - backend
    restart: unless-stopped
